<!doctype html><html lang="ko"><meta charset="utf-8"><title>ScoreVideo MP4 변환 실험</title>
<style>body{font:15px system-ui;background:#111b25;color:#e9f5fa;max-width:720px;margin:40px auto;line-height:1.6}button,input{font:inherit;margin:8px 0}pre{white-space:pre-wrap;background:#1e303d;padding:15px}a{color:#66d8e6}</style>
<h1>WebM → MP4 변환 실험</h1><p>파일은 이 브라우저에서만 처리합니다. ScoreVideo 출력 UI와 연결되지 않은 30초 성능 검증용입니다.</p>
<input id="source" type="file" accept="video/webm,.webm"><br><button id="convert" disabled>H.264/AAC MP4로 변환</button><button id="cancel" disabled>취소</button>
<p><a id="download" hidden>MP4 다운로드</a></p><pre id="status">30초 WebM을 선택하세요.</pre>
<script type="module" src="./prototype.js"></script></html>
